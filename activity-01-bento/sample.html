<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <title>Bento Layout</title>
  <style>
    .card {
      height: 200px;
    }
    .third-row .card {
      height: 400px;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row mt-3 mb-3 first-row">
      <div class="col-12">
        <div class="card p-1"></div>
      </div>
    </div>

    <div class="row mt-3 mb-3 second-row">
      <div class="col-3">
        <div class="card p-1"></div>
      </div>
      <div class="col-3">
        <div class="card p-1"></div>
      </div>
      <div class="col-3">
        <div class="card p-1"></div>
      </div>
      <div class="col-3">
        <div class="card p-1"></div>
      </div>
    </div>

    <div class="row mt-3 mb-3 third-row">
      <div class="col-4">
        <div class="card p-1"></div>
      </div>
      <div class="col-4">
        <div class="card p-1"></div>
      </div>
      <div class="col-4">
        <div class="card p-1"></div>
        
    </div>
  </div>

</body>

</html>
